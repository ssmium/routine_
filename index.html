<style>
@font-face{
  font-family:'Pretendard';
  src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/woff2/PretendardVariable.woff2') format('woff2');
  font-weight:100 900;
  font-display:swap;
}

:root{
  --bg:#FFFFFF;
  --card:#FFFFFF;
  --ink:#191F28;
  --sub:#6B7684;
  --muted:#8B95A1;
  --line:#ECEFF3;
  --line2:#DDE3EA;
  --green:#24C47A;
  --green-dark:#12885B;
  --green-soft:#E8F7F0;
  --yellow:#F4C644;
  --yellow-soft:#FFF6D6;
  --purple:#E8D8F0;
  --purple-deep:#51345F;
  --lime:#DBEFB8;
  --lime-deep:#486132;
  --shadow:0 10px 30px rgba(0,0,0,.055);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  min-height:100vh;
  line-height:1.45;
}
button,input,textarea,select{font:inherit;}
button{border:0;background:none;color:inherit;cursor:pointer;}
::placeholder{color:#C2C9D2;}

.app{
  max-width:720px;
  margin:0 auto;
  min-height:100vh;
  padding:0 18px 190px;
}

.header{
  position:sticky;
  top:0;
  z-index:20;
  padding:calc(16px + env(safe-area-inset-top,0px)) 0 14px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(236,239,243,.78);
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:flex-start;
}

.month-btn{
  display:flex;
  align-items:center;
  gap:7px;
  padding:6px 2px;
  font-size:24px;
  font-weight:880;
  letter-spacing:-.045em;
}

.month-btn .caret{
  color:var(--sub);
  font-size:15px;
  margin-top:3px;
}

.week-strip{
  margin-top:16px;
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:10px;
}

.day-col{
  text-align:center;
  min-width:0;
}

.weekday{
  margin-bottom:8px;
  font-size:14px;
  font-weight:800;
  color:#98A2AE;
}

.day-pill{
  width:100%;
  min-height:66px;
  border-radius:24px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:transparent;
  position:relative;
}

.day-pill .num{
  width:44px;
  height:44px;
  border-radius:999px;
  display:grid;
  place-items:center;
  font-size:16px;
  font-weight:800;
  background:#F1F3F5;
  color:#C1C7D0;
}

.day-pill.done .num{
  background:#62CB7A;
  color:#fff;
}

.day-pill.partial .num{
  background:var(--yellow);
  color:#fff;
}

.day-pill.low .num{
  background:#F46A6A;
  color:#fff;
}

.day-pill.selected{
  background:#3F454B;
  box-shadow:0 10px 22px rgba(30,35,40,.18);
}

.day-pill.selected .num{
  color:#fff;
}

.day-pill.selected.done .num{
  background:#62CB7A;
  color:#fff;
}

.day-pill.selected.partial .num{
  background:var(--yellow);
  color:#fff;
}

.day-pill.selected.low .num{
  background:#F46A6A;
  color:#fff;
}

.day-pill.selected.has-board .num,
.day-pill.selected.empty .num{
  background:#B9BEC4;
  color:#646B73;
}

.tabs-wrap{
  margin-top:18px;
  border-radius:30px 30px 22px 22px;
  overflow:hidden;
  background:#F4F5F6;
  border:1px solid #EFF1F3;
}

.segment{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
}

.segment-btn{
  padding:19px 10px;
  font-size:20px;
  font-weight:850;
  letter-spacing:-.035em;
  color:#9BA4AE;
  background:#F6F7F8;
}

.segment-btn.active{
  background:#fff;
  color:#234A35;
}

.segment-btn .count{
  font-size:14px;
  color:#A7B0BA;
  margin-left:4px;
}

.toolbar{
  padding:16px 16px 6px;
}

.chips{
  display:flex;
  gap:10px;
  overflow:auto;
  scrollbar-width:none;
  padding-bottom:8px;
}
.chips::-webkit-scrollbar{display:none;}

.chip{
  height:42px;
  padding:0 16px;
  border-radius:999px;
  background:#fff;
  border:1px solid var(--line);
  color:var(--sub);
  font-size:15px;
  font-weight:780;
  display:inline-flex;
  align-items:center;
  gap:7px;
  white-space:nowrap;
  box-shadow:0 4px 10px rgba(0,0,0,.025);
}

.chip.active{
  background:#4D5359;
  color:#fff;
  border-color:#4D5359;
}

.chip.view-toggle{
  min-width:48px;
  padding:0;
  justify-content:center;
}

.board{
  padding:6px 16px 18px;
}

.group{
  margin-top:12px;
  display:block;
}

.group-left{
  display:none;
}

.collapse{
  width:24px;
  height:24px;
  display:grid;
  place-items:center;
  border-radius:8px;
  color:#70757C;
  background:#fff;
  border:1px solid var(--line);
}

.order{
  width:24px;
  height:24px;
  display:grid;
  place-items:center;
}

.order.current{
  color:#1E7B54;
  font-weight:900;
}

.group-card{
  background:#fff;
  border:1px solid var(--line2);
  border-radius:20px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.group-head{
  display:grid;
  grid-template-columns:42px 116px 1fr 66px;
  min-height:74px;
  border-bottom:1px solid var(--line2);
}

.group-head>div{
  padding:14px 12px;
  display:flex;
  align-items:center;
  min-width:0;
  font-size:15px;
  font-weight:850;
  letter-spacing:-.02em;
}

.group-head .label,
.group-head .title{
  background:#EEF1BF;
  color:#38452A;
}

.group-head .title{
  border-left:1px solid rgba(0,0,0,.06);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.group-head .score{
  justify-content:center;
  flex-direction:column;
  text-align:center;
  gap:3px;
  background:#F4E893;
  border-left:1px solid rgba(0,0,0,.06);
}

.group-card.purple .group-head .label,
.group-card.purple .group-head .title{
  background:var(--purple);
  color:var(--purple-deep);
}
.group-card.purple .group-head .score{
  background:#DEC7EA;
  color:var(--purple-deep);
}
.group-card.lime .group-head .label,
.group-card.lime .group-head .title{
  background:var(--lime);
  color:var(--lime-deep);
}
.group-card.lime .group-head .score{
  background:#CDE4A2;
  color:var(--lime-deep);
}

.group-head .order-col{
  background:#EEF1BF;
  border-right:1px solid rgba(0,0,0,.06);
}

.group-card.purple .group-head .order-col{
  background:var(--purple);
}

.group-card.lime .group-head .order-col{
  background:var(--lime);
}

.item-row{
  display:grid;
  grid-template-columns:42px 116px 1fr 66px;
  min-height:74px;
  border-bottom:1px solid var(--line2);
  background:#F7F8EE;
}
.item-row:last-child{border-bottom:0;}
.group-card.purple .item-row{background:#F6F1F9;}
.group-card.lime .item-row{background:#F4F8EA;}

.cell{
  padding:14px 12px;
  min-width:0;
  display:flex;
  align-items:center;
  border-right:1px solid var(--line2);
  font-size:15px;
  color:#3E4348;
}

.cell:last-child{border-right:0;}
.cell.time{
  color:#49515A;
  font-weight:750;
}

.order-col{
  justify-content:center;
  padding:14px 8px;
  color:#96A0AA;
  font-size:14px;
  font-weight:850;
  background:#F9FAFB;
}

.order-col.current{
  color:#1E7B54;
}
.cell.task{
  gap:8px;
  justify-content:space-between;
  cursor:pointer;
}
.cell.task:active,
.cell.time:active{
  background:rgba(36,196,122,.05);
}

.task-main{
  min-width:0;
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:750;
}

.task-main .text{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:normal;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}

.task-badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px 7px;
  border-radius:999px;
  background:#FFF0E7;
  color:#EA9B16;
  font-size:12px;
  font-weight:850;
  white-space:nowrap;
  flex-shrink:0;
}

.cell.check{
  justify-content:center;
  flex-direction:column;
  gap:5px;
  text-align:center;
  font-weight:850;
  cursor:pointer;
}

.cell.check:empty::after{
  content:'';
  width:22px;
  height:22px;
  border-radius:999px;
  background:transparent;
}

.cell.check:active{
  background:rgba(36,196,122,.06);
}

.check-emoji{
  font-size:28px;
  line-height:1;
}

.ratio{
  font-size:12px;
  color:var(--sub);
  font-weight:850;
}

.empty-card{
  margin-top:14px;
  padding:34px 20px;
  border-radius:22px;
  background:#fff;
  border:1px dashed #D9DEE5;
  color:var(--sub);
  text-align:center;
}

.empty-card .emoji{
  font-size:34px;
  margin-bottom:10px;
}


.stats-view{
  display:grid;
  gap:14px;
}

.stats-month{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin:2px 0 8px;
}

.stats-month button{
  width:34px;
  height:34px;
  border-radius:12px;
  background:#F7F8FA;
  border:1px solid var(--line);
  color:var(--sub);
  font-size:18px;
  font-weight:850;
}

.stats-month strong{
  font-size:20px;
  font-weight:880;
  letter-spacing:-.04em;
}

.stats-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  box-shadow:0 8px 24px rgba(0,0,0,.045);
}

.stats-card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}

.stats-card h3{

<script>
(function(){
  'use strict';

  const STORAGE_KEY = 'routine_board_clean_v1';

  const state = {
    majorView: 'home',
    view: 'routine',
    selectedDateKey: '2026-05-28',
    calendarYear: 2026,
    calendarMonth: 5,
    selectedCategory: '하루',
    weekDays: [],
    weightLogs: {},
    selectedWeightTarget: null,
    boardsByDate: {},
    selectedRoutineAction: null,
    editingRoutineTarget: null,
    editingTodoTarget: null,
    categories: [
      { label:'하루', icon:'' },
      { label:'건강 챙기기', icon:'💪' },
      { label:'정돈된 일상', icon:'✨' },
      { label:'나 돌보기', icon:'💚' },
      { label:'출근', icon:'🚇' },
      { label:'퇴근 후', icon:'🌙' },
      { label:'고양이', icon:'🐈' }
    ]
  };

  const sampleGroups = [
    {
      id: uid(),
      category:'하루',
      theme:'yellow',
      label:'일어나자마자',
      title:'🌞 모닝 루틴',
      summaryEmoji:'🌞',
      items:[
        { habitKey:uid(), time:'일어나자마자', text:'공복에 물 한 잔', emoji:'🥛', checked:false },
        { habitKey:uid(), time:'07:20', text:'몸무게 기록', emoji:'⚖️', routineType:'weight', checked:false },
        { habitKey:uid(), time:'07:25', text:'컨디션 체크', emoji:'✅', checked:false }
      ]
    }
  ];

  const weekStrip = document.getElementById('weekStrip');
  const monthLabel = document.getElementById('monthLabel');
  const board = document.getElementById('board');
  const categoryChips = document.getElementById('categoryChips');
  const todoCount = document.getElementById('todoCount');

  const calendarBackdrop = document.getElementById('calendarBackdrop');
  const calendarSheet = document.getElementById('calendarSheet');
  const calendarGrid = document.getElementById('calendarGrid');
  const calendarTitle = document.getElementById('calendarTitle');

  const addBackdrop = document.getElementById('addBackdrop');
  const addSheet = document.getElementById('addSheet');
  const addSheetTitle = document.getElementById('addSheetTitle');
  const addSheetDesc = document.getElementById('addSheetDesc');
  const addSheetBody = document.getElementById('addSheetBody');

  const actionBackdrop = document.getElementById('actionBackdrop');
  const actionSheet = document.getElementById('actionSheet');
  const toast = document.getElementById('toast');

  const weightBackdrop = document.getElementById('weightBackdrop');
  const weightPopup = document.getElementById('weightPopup');
  const weightInput = document.getElementById('weightInput');
  const weightDateLabel = document.getElementById('weightDateLabel');

  function uid(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  function pad2(value){
    return String(value).padStart(2,'0');
  }

  function formatDateKey(date){
    return `${date.getFullYear()}-${pad2(date.getMonth()+1)}-${pad2(date.getDate())}`;
  }

  function parseDateKey(key){
    const [year, month, day] = key.split('-').map(Number);
    return { year, month, day };
  }

  function dateFromKey(key){
    const { year, month, day } = parseDateKey(key);
    return new Date(year, month - 1, day);
  }

  function buildWeek(dateKey){
    const selected = dateFromKey(dateKey);
    const jsDay = selected.getDay();
    const mondayOffset = jsDay === 0 ? -6 : 1 - jsDay;
    const monday = new Date(selected);
    monday.setDate(selected.getDate() + mondayOffset);
    const labels = ['일','월','화','수','목','금','토'];

    state.weekDays = Array.from({ length:7 }, (_, idx) => {
      const d = new Date(monday);
      d.setDate(monday.getDate() + idx);
      return {
        key: formatDateKey(d),
        label: labels[d.getDay()],
        num: d.getDate()
      };
    });
  }

  function getSelectedDate(){
    return parseDateKey(state.selectedDateKey);
  }

  function getSelectedLabel(){
    const d = dateFromKey(state.selectedDateKey);
    const labels = ['일','월','화','수','목','금','토'];
    return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${labels[d.getDay()]}요일`;
  }

  function makeBoard(){
    return { routineGroups:[], todos:[] };
  }

  function ensureBoard(dateKey = state.selectedDateKey){
    if (!state.boardsByDate[dateKey]) state.boardsByDate[dateKey] = makeBoard();
    return state.boardsByDate[dateKey];
  }

  function currentBoard(){
    return ensureBoard(state.selectedDateKey);
  }

  function saveData(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      selectedDateKey: state.selectedDateKey,
      boardsByDate: state.boardsByDate,
      weightLogs: state.weightLogs,
      majorView: state.majorView
    }));
  }

  function loadData(){
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) {
      state.boardsByDate[state.selectedDateKey] = {
        routineGroups: structuredClone(sampleGroups),
        todos: []
      };
      saveData();
      return;
    }

    try{
      const parsed = JSON.parse(saved);
      state.boardsByDate = parsed.boardsByDate || {};
      state.weightLogs = parsed.weightLogs || {};
      state.majorView = parsed.majorView || state.majorView;
      state.selectedDateKey = parsed.selectedDateKey || state.selectedDateKey;
    }catch(e){
      state.boardsByDate[state.selectedDateKey] = {
        routineGroups: structuredClone(sampleGroups),
        todos:[]
      };
    }

    Object.values(state.boardsByDate).forEach(board => {
      (board.routineGroups || []).forEach(group => {
        (group.items || []).forEach(item => {
          if (!item.habitKey) item.habitKey = uid();
        });
      });
      if (!Array.isArray(board.todos)) board.todos = [];
    });
  }

  function getBoardStatus(dateKey){
    const b = state.boardsByDate[dateKey];
    if (!b) return 'empty';

    const items = (b.routineGroups || []).flatMap(group => group.items || []);
    const todos = b.todos || [];
    const total = items.length + todos.length;
    const done = items.filter(item => item.checked).length + todos.filter(todo => todo.done).length;

    if (!total) return 'empty';
    if (done === 0) return 'has-board';

    const ratio = done / total;

    if (ratio >= 1) return 'done';      // 예: 3/3
    if (ratio >= 2/3) return 'partial'; // 예: 2/3
    return 'low';                       // 예: 1/3
  }

  function findItemByHabitKey(boardData, habitKey){
    for (const group of (boardData.routineGroups || [])) {
      const item = (group.items || []).find(it => it.habitKey === habitKey);
      if (item) return item;
    }
    return null;
  }

  function getStreakBonus(item){
    if (!item?.habitKey || !item.checked) return 0;
    let cursor = dateFromKey(state.selectedDateKey);
    let streakDays = 0;

    while(true){
      const key = formatDateKey(cursor);
      const boardData = state.boardsByDate[key];
      const matched = boardData ? findItemByHabitKey(boardData, item.habitKey) : null;
      if (matched && matched.checked) {
        streakDays += 1;
        cursor.setDate(cursor.getDate() - 1);
      } else {
        break;
      }
    }
    return Math.max(0, streakDays - 1);
  }


  function isWeightRoutine(item){
    return item?.routineType === 'weight' || String(item?.text || '').includes('몸무게');
  }

  function weightKeyForItem(item){
    return item?.habitKey || 'default-weight';
  }

  function getWeightValue(item){
    const dateLog = state.weightLogs[state.selectedDateKey] || {};
    return dateLog[weightKeyForItem(item)] || '';
  }


  function render(){
    buildWeek(state.selectedDateKey);
    renderHeader();
    renderTabs();
    renderCategories();
    renderBoard();
  }

  function renderHeader(){
    const caret = document.querySelector('.month-btn .caret');

    if (state.majorView === 'profile') {
      monthLabel.textContent = '마이페이지';
      if (caret) caret.style.display = 'none';
      weekStrip.style.display = 'none';
      return;

  function monthStartEnd(){

  }

  function getMonthKeys(){
    const { year, month, days } = monthStartEnd();
    const keys = [];
    for (let day = 1; day <= days; day++) {
      keys.push(`${year}-${pad2(month)}-${pad2(day)}`);
    }
    return keys;
  }

  function collectMonthRoutineItems(){
    const keys = getMonthKeys();
    const map = new Map();

    keys.forEach(key => {
      const b = state.boardsByDate[key];
      if (!b) return;

      (b.routineGroups || []).forEach(group => {
        (group.items || []).forEach(item => {
          const id = item.habitKey || `${group.title}_${item.time}_${item.text}`;
          if (!map.has(id)) {
            map.set(id, {
              id,
              title: item.text,
              time: item.time,
              emoji: item.emoji || group.summaryEmoji || '✅',
              category: group.category,
              records: {}
            });
          }
          map.get(id).records[key] = {
            exists: true,
            checked: !!item.checked
          };
        });
      });
    });

    return Array.from(map.values());
  }

  function getMonthSummary(){
    const keys = getMonthKeys();
    let routineTotal = 0;
    let routineDone = 0;
    let todoTotal = 0;
    let todoDone = 0;

    keys.forEach(key => {
      const b = state.boardsByDate[key];
      if (!b) return;

      (b.routineGroups || []).forEach(group => {
        (group.items || []).forEach(item => {
          routineTotal += 1;
          if (item.checked) routineDone += 1;
        });
      });

      (b.todos || []).forEach(todo => {
        todoTotal += 1;
        if (todo.done) todoDone += 1;
      });
    });

    const total = routineTotal + todoTotal;
    const done = routineDone + todoDone;
    const rate = total ? Math.round(done / total * 100) : 0;

    return { routineTotal, routineDone, todoTotal, todoDone, total, done, rate };
  }

  function getWeightStats(){
    const keys = getMonthKeys();
    const rows = [];

    keys.forEach(key => {
      const log = state.weightLogs[key] || {};
      Object.values(log).forEach(value => {
        const number = parseFloat(String(value).replace('kg',''));
        if (!Number.isNaN(number)) {
          rows.push({ key, value: number });
        }
      });
    });

    if (!rows.length) return null;

    const latest = rows[rows.length - 1];
    const avg = rows.reduce((sum, row) => sum + row.value, 0) / rows.length;
    const min = Math.min(...rows.map(row => row.value));
    const max = Math.max(...rows.map(row => row.value));

    return {
      count: rows.length,
      latest,
      avg: Math.round(avg * 10) / 10,
      min,
      max
    };
  }

  function boardHasAnyRecord(dateKey){
    const b = state.boardsByDate[dateKey];

    const hasTodo = (b.todos || []).length > 0;

    const startKey = getRoutineStartDateKey();
    const start = dateFromKey(startKey);

    const diff = Math.floor((current - start) / (1000 * 60 * 60 * 24));
    return Math.max(1, diff + 1);

  function renderCalendar(){
    calendarTitle.textContent = `${state.calendarYear}년 ${state.calendarMonth}월`;

    const first = new Date(state.calendarYear, state.calendarMonth - 1, 1);
    const last = new Date(state.calendarYear, state.calendarMonth, 0);
    const firstDay = first.getDay();
    const leading = firstDay === 0 ? 6 : firstDay - 1;
    const daysInMonth = last.getDate();

    const prevLast = new Date(state.calendarYear, state.calendarMonth - 1, 0).getDate();
    const cells = [];

    for (let i=leading; i>0; i--) {
      cells.push(`<button class="calendar-day blank outside" type="button">${prevLast - i + 1}</button>`);
    }

    for (let day=1; day<=daysInMonth; day++) {
      const key = `${state.calendarYear}-${pad2(state.calendarMonth)}-${pad2(day)}`;
      const status = getBoardStatus(key);
      const selected = key === state.selectedDateKey ? 'selected' : '';
      cells.push(`<button class="calendar-day ${selected} ${status}" type="button" data-calendar-date="${key}">${day}</button>`);
    }

    while (cells.length % 7 !== 0) {
      const nextDay = cells.length % 7;
      cells.push(`<button class="calendar-day blank outside" type="button">${nextDay}</button>`);
    }

    calendarGrid.innerHTML = cells.join('');
  }

      if (sourceGroup && sourceItem) {

          time,
          text,
          emoji,
          routineType
        };

        if (sourceGroup.id === targetGroup.id) {

  function addRoutineToDate(dateKey, sourceGroup, sourceItem){
    const target = ensureBoard(dateKey);
    let group = target.routineGroups.find(g =>
      g.category === sourceGroup.category &&
      g.label === sourceGroup.label &&
      g.title === sourceGroup.title
    );
    if (!group) {
      group = cloneGroupShell(sourceGroup);
      target.routineGroups.push(group);
    }

    const exists = group.items.some(item =>
      item.habitKey === sourceItem.habitKey ||
      (item.time === sourceItem.time && item.text === sourceItem.text)
    );
    if (!exists) group.items.push(cloneItem(sourceItem));
  }

    const selected = selectedRoutine();
    if (!selected) return;
    const d = dateFromKey(state.selectedDateKey);
    d.setDate(d.getDate() + 1);
    addRoutineToDate(formatDateKey(d), selected.group, selected.item);
    saveData();
    closeRoutineAction();
    showToast('내일 일정에도 추가했어요');
  }

  function actionRepeat(mode){
    const selected = selectedRoutine();
    if (!selected) return;

    state.weekDays.forEach(day => {
      const d = dateFromKey(day.key);
      const jsDay = d.getDay();
      const weekday = jsDay >= 1 && jsDay <= 5;
      if (mode === 'weekday' && !weekday) return;
      addRoutineToDate(day.key, selected.group, selected.item);
    });

    saveData();
    closeRoutineAction();
    showToast(mode === 'weekday' ? '평일 반복으로 추가했어요' : '이번 주 반복으로 추가했어요');
  }

    render();
    showToast('루틴을 삭제했어요');
  }


  function switchView(view){
    state.majorView = 'home';
    state.view = view;
    saveData();
    render();
  }

  function showToast(text){
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => toast.classList.remove('show'), 1500);
  }

  function escapeHtml(text){
    return String(text ?? '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'","&#039;");
  }

  document.addEventListener('click', (e) => {
    const bottomNavTarget = e.target.closest('[data-bottom-nav]');
    if (bottomNavTarget) {
      switchBottomNav(bottomNavTarget.dataset.bottomNav);
      return;
    }

    const statsMonthTarget = e.target.closest('[data-stats-month]');
    if (statsMonthTarget) {
      moveStatsMonth(Number(statsMonthTarget.dataset.statsMonth));
      return;
    }

    const dateTarget = e.target.closest('[data-date]');
    if (dateTarget) {
      state.selectedDateKey = dateTarget.dataset.date;
      state.selectedCategory = '하루';
      state.view = 'routine';
      ensureBoard();
      saveData();
      render();
      return;
    }

    const calendarDateTarget = e.target.closest('[data-calendar-date]');
    if (calendarDateTarget) {
      selectDate(calendarDateTarget.dataset.calendarDate);
      return;
    }

    const categoryTarget = e.target.closest('[data-category]');
    if (categoryTarget) {
      state.selectedCategory = categoryTarget.dataset.category;
      render();
      return;
    }

    const viewTarget = e.target.closest('[data-view]');
    if (viewTarget) {
      switchView(viewTarget.dataset.view);
      return;
    }

    const openRoutineTarget = e.target.closest('[data-open-routine]');
    if (openRoutineTarget) {
      openRoutineAction(openRoutineTarget.dataset.groupId, Number(openRoutineTarget.dataset.openRoutine));
      return;
    }

    const checkRoutineTarget = e.target.closest('[data-check-routine]');
    if (checkRoutineTarget) {
      toggleRoutine(checkRoutineTarget.dataset.groupId, Number(checkRoutineTarget.dataset.checkRoutine));
      return;
    }

    const checkTodoTarget = e.target.closest('[data-check-todo]');
    if (checkTodoTarget) {
      toggleTodo(Number(checkTodoTarget.dataset.checkTodo));
      return;
    }

    const editTodoTarget = e.target.closest('[data-edit-todo]');
    if (editTodoTarget) {
      openTodoAddSheet(Number(editTodoTarget.dataset.editTodo));
      return;
    }

    const closeAddTarget = e.target.closest('[data-close-add]');
    if (closeAddTarget) {
      closeAddSheet();
    }
  });

  document.getElementById('openCalendar').addEventListener('click', (e) => {
    e.preventDefault();
    if (state.majorView !== 'home') return;
    openCalendarSheet();
  });
  document.getElementById('calendarPrev').addEventListener('click', () => moveCalendarMonth(-1));
  document.getElementById('calendarNext').addEventListener('click', () => moveCalendarMonth(1));
  document.getElementById('calendarToday').addEventListener('click', goToday);
  calendarBackdrop.addEventListener('click', closeCalendarSheet);

  document.getElementById('openAddSheet').addEventListener('click', openAddSheet);
  document.getElementById('closeAddSheet').addEventListener('click', closeAddSheet);
  addBackdrop.addEventListener('click', closeAddSheet);

  document.getElementById('closeWeightPopup').addEventListener('click', closeWeightPopup);
  document.getElementById('cancelWeight').addEventListener('click', closeWeightPopup);
  document.getElementById('saveWeight').addEventListener('click', saveWeightValue);
  const deleteWeightRoutineBtn = document.getElementById('deleteWeightRoutine');
  if (deleteWeightRoutineBtn) {
    deleteWeightRoutineBtn.addEventListener('click', deleteWeightRoutine);
  }
  weightBackdrop.addEventListener('click', closeWeightPopup);
  weightInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') saveWeightValue();
  });

  document.getElementById('closeActionSheet').addEventListener('click', closeRoutineAction);
  actionBackdrop.addEventListener('click', closeRoutineAction);
  document.getElementById('actionWeightRegister').addEventListener('click', openWeightFromAction);
  document.getElementById('actionEdit').addEventListener('click', editSelectedRoutine);
  document.getElementById('actionTomorrow').addEventListener('click', actionTomorrow);
  document.getElementById('actionRepeatWeek').addEventListener('click', () => actionRepeat('week'));
  document.getElementById('actionRepeatWeekday').addEventListener('click', () => actionRepeat('weekday'));
  document.getElementById('actionDelete').addEventListener('click', actionDeleteRoutine);

  loadData();
  ensureBoard();
  render();
})();
</script>
</body>
</html>
