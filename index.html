<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>루틴보드</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap');

:root{
  --bg:#F5F6FA;
  --white:#FFFFFF;
  --ink:#1A1C26;
  --ink2:#46505C;
  --muted:#9BA5B4;
  --line:#E6E9F0;
  --line2:#D0D6E2;
  --green:#3EC87C;
  --green-bg:#E6F9EE;
  --green-dark:#1B8F50;
  --yellow:#F5C518;
  --yellow-bg:#FFFAE0;
  --red:#F04848;
  --red-bg:#FFF0EF;
  /* group themes */
  --yw-hdr:#F7F0A8;   --yw-row:#FEFCE8;   --yw-score:#F0E050;
  --pp-hdr:#EDD8FF;   --pp-row:#FAF4FF;   --pp-score:#D8AAFF;
  --lm-hdr:#D8F0A8;   --lm-row:#F4FCE8;   --lm-score:#C2E870;
  --gn-hdr:#C2EDD4;   --gn-row:#F0FBF5;   --gn-score:#90D8B0;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;min-height:100vh;}
button,input,select,textarea{font:inherit;border:0;background:none;color:inherit;cursor:pointer;outline:none;}
::placeholder{color:var(--muted);}

.app{max-width:680px;margin:0 auto;padding:0 0 calc(90px + var(--safe-b));}

/* ═══════════════════════════════
   HEADER  (exact match to image)
═══════════════════════════════ */
.hdr{
  position:sticky;top:0;z-index:50;
  background:var(--white);
  padding:calc(var(--safe-t) + 16px) 16px 0;
}

/* Row 1: 월/연도 + 아이콘들 */
.hdr-r1{
  display:flex;align-items:center;gap:8px;
  margin-bottom:18px;
}
.month-btn{
  display:flex;align-items:center;gap:4px;
  font-size:20px;font-weight:900;letter-spacing:-.04em;color:var(--ink);
  flex:1;
}
.month-caret{font-size:14px;color:var(--ink2);margin-top:1px;}
.streak-pill{
  display:flex;align-items:center;gap:3px;height:28px;padding:0 10px;
  border-radius:99px;background:#FF7043;color:#fff;
  font-size:13px;font-weight:800;
}
.hdr-icon{
  width:30px;height:30px;display:grid;place-items:center;
  font-size:17px;color:var(--ink2);font-weight:700;
}

/* Row 2: 요일 + 날짜 원형 */
.week-wrap{
  display:grid;grid-template-columns:repeat(7,1fr);
  gap:4px;margin-bottom:14px;
}
.day-col{text-align:center;display:flex;flex-direction:column;align-items:center;}
.wd-lbl{
  font-size:12px;font-weight:600;color:var(--muted);
  margin-bottom:6px;letter-spacing:.02em;
}
.day-circle{
  width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;
  font-size:15px;font-weight:800;
  color:#C8D0DC;background:transparent;
  transition:background .13s,color .13s,transform .1s;
}
.day-circle:active{transform:scale(.9);}
/* 선택 = 어두운 회색 (기본, 루틴 없을 때) */
.day-circle.sel{background:#484F5C;color:#fff;}
/* 완료 상태 — sel 여부 관계없이 항상 색상 표시 */
.day-circle.done{background:var(--green);color:#fff;}
.day-circle.partial{background:var(--yellow);color:#fff;}
.day-circle.low{background:var(--red);color:#fff;}
.day-circle.sel.done{background:var(--green);color:#fff;}
.day-circle.sel.partial{background:var(--yellow);color:#fff;}
.day-circle.sel.low{background:var(--red);color:#fff;}

/* Row 3: 루틴 / 투두 탭 */
.tab-row{
  display:grid;grid-template-columns:1fr 1fr;
  border-bottom:1.5px solid var(--line);
  margin-bottom:0;
}
.tab-btn{
  height:42px;font-size:15px;font-weight:700;
  color:var(--muted);position:relative;transition:color .15s;
}
.tab-btn.act{color:var(--ink);font-weight:900;}
.tab-btn.act::after{
  content:'';position:absolute;bottom:-1.5px;left:20%;right:20%;
  height:2.5px;border-radius:99px 99px 0 0;background:var(--ink);
}
.tab-badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:18px;height:18px;padding:0 5px;border-radius:99px;
  background:var(--line);color:var(--ink2);
  font-size:10.5px;font-weight:800;margin-left:4px;
  vertical-align:middle;
}

/* Row 4: 카테고리 칩 */
.cat-row{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding:10px 16px 10px;
  background:var(--white);
  border-bottom:1px solid rgba(230,233,240,.7);
}
.cat-row::-webkit-scrollbar{display:none;}
.cat-chip{
  height:32px;padding:0 13px;border-radius:99px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;flex-shrink:0;
  font-size:13px;font-weight:700;
  background:var(--white);border:1.5px solid var(--line);color:var(--ink2);
  transition:all .13s;
}
/* 선택된 칩 = 어두운 pill */
.cat-chip.act{background:#484F5C;border-color:#484F5C;color:#fff;}
.cat-chip.act .cat-caret{opacity:.6;font-size:10px;}
.cat-chip:active{transform:scale(.95);}
.view-icon-btn{
  height:32px;width:34px;border-radius:8px;flex-shrink:0;
  display:grid;place-items:center;font-size:16px;color:var(--ink2);
  background:var(--white);border:1.5px solid var(--line);
}

/* ═══════════════════════════════
   BOARD
═══════════════════════════════ */
.board{padding:10px 14px;display:flex;flex-direction:column;gap:10px;}

/* ─── Group Card ─── */
.gc{border-radius:16px;overflow:hidden;border:1px solid rgba(0,0,0,.07);background:var(--white);}

/* Header row — same 4-col grid as item rows */
.gc-hdr{
  display:grid;
  grid-template-columns:44px 1fr auto;
  border-bottom:1px solid rgba(0,0,0,.07);
}
.gc-hdr-toggle{
  display:grid;place-items:center;
  font-size:14px;color:rgba(0,0,0,.45);
  border-right:1px solid rgba(0,0,0,.07);
  cursor:pointer;user-select:none;
}
.gc-hdr-mid{
  padding:11px 12px;
  cursor:pointer;
}
.gc-hdr-label{font-size:12px;font-weight:800;color:rgba(0,0,0,.45);margin-bottom:2px;}
.gc-hdr-title{font-size:15px;font-weight:900;color:var(--ink);letter-spacing:-.02em;}
.gc-hdr-score{
  min-width:58px;padding:0 10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  cursor:pointer;
}
.gc-score-emoji{font-size:26px;line-height:1;}
.gc-score-txt{font-size:11.5px;font-weight:800;color:rgba(0,0,0,.5);}

/* Themes */
.gc.th-yellow .gc-hdr{background:var(--yw-hdr);}
.gc.th-yellow .gc-hdr-score{background:var(--yw-score);}
.gc.th-yellow .item-row{background:var(--yw-row);}
.gc.th-purple .gc-hdr{background:var(--pp-hdr);}
.gc.th-purple .gc-hdr-score{background:var(--pp-score);}
.gc.th-purple .item-row{background:var(--pp-row);}
.gc.th-lime .gc-hdr{background:var(--lm-hdr);}
.gc.th-lime .gc-hdr-score{background:var(--lm-score);}
.gc.th-lime .item-row{background:var(--lm-row);}
.gc.th-green .gc-hdr{background:var(--gn-hdr);}
.gc.th-green .gc-hdr-score{background:var(--gn-score);}
.gc.th-green .item-row{background:var(--gn-row);}

/* ─── Item Row ─── */
.item-row{
  display:grid;
  grid-template-columns:44px 108px 1fr 60px;
  min-height:58px;
  border-top:1px solid rgba(0,0,0,.06);
  transition:filter .1s;
}
.item-row:first-child{border-top:0;}

.item-num{
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;color:var(--muted);
  border-right:1px solid rgba(0,0,0,.06);
  user-select:none;cursor:default;
  transition:background .15s,color .15s;
}
.item-num.first{color:var(--green-dark);}
/* 정렬 모드일 때 드래그 핸들 강조 */
body.sort-mode .item-num{
  cursor:grab;background:var(--green-bg);color:var(--green-dark);
  font-size:18px;
}
body.sort-mode .gc-hdr-toggle{
  cursor:grab;background:var(--green-bg);color:var(--green-dark);
}
body.sort-mode .item-row{cursor:default;}
/* 정렬 모드 아닐 때 드래그 막기 */
body:not(.sort-mode) .item-row,.gc{pointer-events:auto;}
.sort-mode-banner{
  background:var(--green);color:#fff;
  text-align:center;font-size:13px;font-weight:700;
  padding:7px 0;letter-spacing:.01em;
}

.item-time{
  padding:0 10px;
  display:flex;align-items:center;
  font-size:13px;font-weight:700;color:var(--ink2);
  border-right:1px solid rgba(0,0,0,.06);
  cursor:pointer;word-break:keep-all;line-height:1.3;
}
.item-time:active{filter:brightness(.95);}

.item-body{
  padding:10px 10px;
  display:flex;align-items:center;gap:7px;
  cursor:pointer;min-width:0;
  border-right:1px solid rgba(0,0,0,.06);
}
.item-body:active{filter:brightness(.95);}
.item-text{font-size:14px;font-weight:600;color:var(--ink);flex:1;min-width:0;line-height:1.35;}
.streak-bdg{
  display:inline-flex;align-items:center;gap:2px;
  padding:2px 6px;border-radius:99px;
  background:rgba(255,100,0,.1);color:#C84800;
  font-size:11px;font-weight:900;flex-shrink:0;white-space:nowrap;
}

.item-check{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  cursor:pointer;
}
.item-check:active{filter:brightness(.92);}
.chk-ring{
  width:28px;height:28px;border-radius:50%;
  border:2px solid var(--line2);background:rgba(255,255,255,.5);
}
.chk-emoji{font-size:26px;line-height:1;}
.chk-val{font-size:10.5px;font-weight:800;color:var(--ink2);}

/* Done row */
.item-row.done .item-text{text-decoration:line-through;opacity:.55;}

/* ─── Empty ─── */
.empty-box{
  text-align:center;padding:46px 20px;
  background:var(--white);border-radius:16px;
  border:1.5px dashed var(--line2);color:var(--muted);
}
.empty-box .ei{font-size:38px;margin-bottom:10px;}
.empty-box p{font-size:14px;font-weight:600;line-height:1.65;}

/* ─── TODO ─── */
.todo-list{display:flex;flex-direction:column;gap:8px;}
.todo-item{
  background:var(--white);border-radius:14px;border:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;
}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--muted);}
.td-chk{
  width:24px;height:24px;border-radius:7px;flex-shrink:0;
  border:2px solid var(--line2);display:grid;place-items:center;
  transition:all .15s;font-size:13px;font-weight:900;color:transparent;
}
.todo-item.done .td-chk{background:var(--green);border-color:var(--green);color:#fff;}
.todo-text{font-size:14px;font-weight:600;flex:1;min-width:0;}
.todo-time{font-size:12px;color:var(--muted);margin-top:2px;}
.todo-edit{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:14px;color:var(--muted);background:var(--bg);}

/* ═══════════════════════════════
   BOTTOM NAV
═══════════════════════════════ */
.bnav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:min(680px,100%);z-index:60;
  background:rgba(255,255,255,.98);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
  padding:8px 14px calc(8px + var(--safe-b));
}
.bnav-inner{display:flex;align-items:center;gap:5px;}
.bnav-btn{
  flex:1;height:50px;border-radius:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:11px;font-weight:700;
  transition:all .13s;
}
.bnav-btn .bi{font-size:20px;line-height:1;}
.bnav-btn.act{color:var(--green-dark);background:var(--green-bg);}
.fab{
  width:52px;height:52px;border-radius:15px;flex-shrink:0;
  background:var(--green);color:#fff;
  display:grid;place-items:center;font-size:28px;
  box-shadow:0 6px 18px rgba(62,200,124,.38);
  transition:transform .12s;
}
.fab:active{transform:scale(.91);}

/* ═══════════════════════════════
   SHEETS / POPUPS
═══════════════════════════════ */
.bd{
  position:fixed;inset:0;z-index:70;
  background:rgba(26,28,38,.48);
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.bd.show{opacity:1;pointer-events:auto;}

.sheet{
  position:fixed;bottom:0;left:50%;
  width:min(680px,100%);max-height:90vh;overflow-y:auto;
  transform:translate(-50%,106%);z-index:80;
  background:var(--white);border-radius:24px 24px 0 0;
  box-shadow:0 -6px 30px rgba(0,0,0,.13);
  transition:transform .21s cubic-bezier(.32,.72,0,1);
  padding:6px 16px calc(16px + var(--safe-b));
}
.sheet.show{transform:translate(-50%,0);}
.grabber{width:36px;height:5px;border-radius:99px;background:var(--line2);margin:5px auto 16px;}
.sh-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px;}
.sh-title{font-size:18px;font-weight:900;letter-spacing:-.03em;}
.sh-sub{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.5;}
.xbtn{
  width:32px;height:32px;border-radius:10px;flex-shrink:0;
  background:var(--bg);border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:15px;font-weight:800;color:var(--ink2);
}

/* Action list */
.act-eye{
  display:inline-flex;height:22px;padding:0 9px;align-items:center;
  border-radius:99px;background:var(--green-bg);color:var(--green-dark);
  font-size:11px;font-weight:800;margin-bottom:7px;
}
.act-list{display:flex;flex-direction:column;gap:7px;}
.act-row{
  width:100%;display:flex;align-items:center;gap:11px;text-align:left;
  background:var(--bg);border:1px solid var(--line);border-radius:13px;
  padding:12px 12px;transition:background .12s;
}
.act-row:active{background:#E8F5EE;border-color:var(--green);}
.act-row.danger:active{background:var(--red-bg);border-color:var(--red);}
.act-ico{
  width:36px;height:36px;border-radius:11px;
  background:var(--white);border:1px solid var(--line);
  display:grid;place-items:center;font-size:17px;flex-shrink:0;
}
.act-row.danger .act-ico{background:var(--red-bg);}
.act-ttl{font-size:14px;font-weight:800;color:var(--ink);}
.act-desc{font-size:12px;color:var(--muted);font-weight:500;margin-top:2px;}

/* Form */
.form{display:flex;flex-direction:column;gap:10px;}
.fld{display:flex;flex-direction:column;gap:5px;}
.fld label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
.fld input,.fld select,.fld textarea{
  background:var(--bg);border:1.5px solid var(--line);
  border-radius:12px;padding:12px 13px;
  font-size:15px;color:var(--ink);transition:border .14s,box-shadow .14s;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{
  background:var(--white);border-color:var(--green);box-shadow:0 0 0 3px rgba(62,200,124,.13);
}
.fld textarea{resize:vertical;min-height:72px;line-height:1.5;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}
.btn{height:46px;border-radius:13px;font-size:14px;font-weight:800;}
.btn-ghost{background:var(--bg);border:1.5px solid var(--line);color:var(--ink2);}
.btn-primary{background:var(--green);color:#fff;box-shadow:0 5px 14px rgba(62,200,124,.3);}
.btn-danger{background:var(--red-bg);color:var(--red);border:1.5px solid rgba(240,72,72,.25);width:100%;margin-top:8px;}

/* Weight popup */
.popup{
  position:fixed;left:50%;top:50%;z-index:90;
  width:min(334px,calc(100% - 28px));
  background:var(--white);border-radius:20px;
  padding:20px 18px 16px;
  box-shadow:0 12px 40px rgba(0,0,0,.18);
  transform:translate(-50%,-50%) scale(.94);
  opacity:0;pointer-events:none;
  transition:all .17s cubic-bezier(.32,.72,0,1);
}
.popup.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
.wgt-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px;}
.wgt-title{font-size:17px;font-weight:900;}
.wgt-sub{font-size:12.5px;color:var(--muted);margin-top:3px;}
.wgt-inp-wrap{position:relative;margin-bottom:11px;}
.wgt-inp-wrap input{
  width:100%;height:56px;padding:0 46px 0 14px;
  border:1.5px solid var(--line);border-radius:13px;
  background:var(--bg);font-size:24px;font-weight:800;color:var(--ink);
}
.wgt-inp-wrap input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(62,200,124,.12);background:var(--white);}
.wgt-unit{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:700;color:var(--muted);}
.wgt-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

/* Calendar */
.cal-nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-nav-btn{width:32px;height:32px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:17px;display:grid;place-items:center;}
.cal-title{font-size:17px;font-weight:900;letter-spacing:-.03em;}
.cal-wds{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:8px;}
.cal-wds span{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px 2px;}
.cal-cell{
  aspect-ratio:1;border-radius:50%;font-size:14px;font-weight:700;
  display:grid;place-items:center;color:var(--ink2);transition:all .12s;
}
.cal-cell:not(.blank):active{transform:scale(.9);}
.cal-cell.blank{pointer-events:none;color:var(--line2);}
.cal-cell.sel{background:#484F5C;color:#fff;}
.cal-cell.done{background:var(--green);color:#fff;}
.cal-cell.partial{background:var(--yellow);color:#fff;}
.cal-cell.low{background:var(--red);color:#fff;}
.cal-cell.sel.done{background:var(--green);color:#fff;}
.cal-cell.sel.partial{background:var(--yellow);color:#fff;}
.cal-cell.sel.low{background:var(--red);color:#fff;}

/* Stats */
.stats-wrap{display:flex;flex-direction:column;gap:11px;padding-top:8px;}
.sc{background:var(--white);border-radius:14px;border:1px solid var(--line);padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.055);}
.sc h3{font-size:14px;font-weight:800;color:var(--ink2);margin-bottom:11px;}
.sc-big{font-size:33px;font-weight:900;letter-spacing:-.04em;}
.sc-note{font-size:13px;color:var(--muted);margin-top:3px;}
.prog{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:9px;}
.prog div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),#70E0A0);transition:width .5s;}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px;}
.sm{background:var(--bg);border-radius:11px;border:1px solid var(--line);padding:10px;}
.sm strong{display:block;font-size:16px;font-weight:900;}
.sm span{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px;display:block;}
.hg{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.hc{background:var(--white);border-radius:13px;border:1px solid var(--line);padding:12px;}
.hc-title{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:8px;text-align:center;}
.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:8px;}
.dot{aspect-ratio:1;border-radius:4px;background:var(--line);}
.dot.done{background:var(--green);}
.dot.missed{background:rgba(240,72,72,.12);}
.hf{display:flex;justify-content:space-around;font-size:12px;font-weight:700;color:var(--muted);}
.hf b{color:var(--ink);}

/* Profile */
.ph{background:linear-gradient(135deg,#3EC87C,#28A55E);border-radius:14px;padding:24px 16px 20px;text-align:center;color:#fff;margin-bottom:11px;}
.pav{width:66px;height:66px;border-radius:18px;background:rgba(255,255,255,.25);font-size:32px;display:grid;place-items:center;margin:0 auto 10px;}
.pname{font-size:21px;font-weight:900;margin-bottom:2px;}
.phandle{font-size:13px;opacity:.7;font-weight:600;}
.pstats{display:flex;justify-content:center;gap:24px;margin-top:14px;}
.pstat strong{display:block;font-size:19px;font-weight:900;}
.pstat span{font-size:12px;opacity:.7;font-weight:600;}
.pc{background:var(--white);border-radius:14px;border:1px solid var(--line);padding:16px;}

/* Toast */
.toast{
  position:fixed;bottom:calc(72px + var(--safe-b));left:50%;
  transform:translateX(-50%) translateY(10px);z-index:100;
  background:rgba(26,28,38,.9);color:#fff;
  padding:9px 16px;border-radius:99px;
  font-size:13.5px;font-weight:700;
  opacity:0;pointer-events:none;transition:all .16s;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:400px){
  .item-row{grid-template-columns:38px 90px 1fr 54px;}
  .gc-hdr{grid-template-columns:38px 1fr auto;}
  .gc-hdr-score{min-width:50px;}
  .item-num,.gc-hdr-toggle{font-size:12px;}
  .item-time{font-size:12px;padding:0 7px;}
  .item-text{font-size:13px;}
  .chk-emoji{font-size:22px;}
}

/* ── 모바일 전용 최적화 ── */
@media(max-width:480px){
  /* 헤더 여백 축소 */
  .hdr{padding:calc(var(--safe-t) + 10px) 14px 0;}
  .hdr-r1{margin-bottom:14px;}
  .month-btn{font-size:18px;}
  /* 날짜 원형 */
  .day-circle{width:34px;height:34px;font-size:13px;}
  .wd-lbl{font-size:11px;margin-bottom:4px;}
  .week-wrap{gap:2px;margin-bottom:10px;}
  /* 탭 */
  .tab-btn{height:38px;font-size:14px;}
  /* 카테고리 칩 */
  .cat-row{padding:8px 14px 8px;gap:6px;}
  .cat-chip{height:30px;padding:0 11px;font-size:12.5px;}
  /* 보드 */
  .board{padding:8px 12px;gap:8px;}
  /* 그룹 */
  .gc-hdr{grid-template-columns:36px 1fr auto;}
  .gc-hdr-mid{padding:9px 10px;}
  .gc-hdr-label{font-size:11px;}
  .gc-hdr-title{font-size:14px;}
  .gc-hdr-score{min-width:48px;padding:0 8px;}
  .gc-score-emoji{font-size:22px;}
  .gc-score-txt{font-size:11px;}
  /* 아이템 */
  .item-row{grid-template-columns:36px 86px 1fr 52px;min-height:54px;}
  .item-num{font-size:12px;}
  .item-time{font-size:12px;padding:0 7px;}
  .item-text{font-size:13px;}
  .chk-emoji{font-size:22px;}
  .streak-bdg{font-size:10px;padding:2px 5px;}
  /* 정렬모드 핸들 더 크게 (터치 쉽도록) */
  body.sort-mode .item-num{font-size:20px;}
  /* 시트 */
  .sheet{max-height:92vh;}
  .sh-title{font-size:17px;}
  .act-ttl{font-size:13px;}
  .fld input,.fld select,.fld textarea{font-size:16px;} /* iOS zoom 방지 */
  /* 하단 네비 */
  .bnav{padding:6px 12px calc(6px + var(--safe-b));}
  .bnav-btn{height:46px;font-size:10.5px;}
  .bnav-btn .bi{font-size:19px;}
  .fab{width:48px;height:48px;font-size:26px;}
  /* 투두 */
  .todo-item{padding:12px;}
}
</style>
</head>
<body>
<div class="app">

  <!-- ═══ HEADER ═══ -->
  <header class="hdr" id="hdr">

    <!-- Row1: 날짜 + 아이콘 -->
    <div class="hdr-r1">
      <button class="month-btn" id="openCal">
        <span id="monthLbl"></span>
        <span class="month-caret">∨</span>
      </button>
      <div class="streak-pill">🔥 <span id="streakNum">0</span></div>
      <button class="hdr-icon" id="gotoToday" title="오늘">↕</button>
      <button class="hdr-icon">···</button>
    </div>

    <!-- Row2: 주간 -->
    <div class="week-wrap" id="weekWrap"></div>

    <!-- Row3: 루틴/투두 탭 -->
    <div class="tab-row" id="tabRow"></div>

    <!-- Row4: 카테고리 -->
    <div class="cat-row" id="catRow" style="display:none;"></div>

  </header>

  <!-- ═══ BOARD ═══ -->
  <div class="board" id="board"></div>

</div>

<!-- Bottom Nav -->
<nav class="bnav">
  <div class="bnav-inner">
    <button class="bnav-btn act" data-nav="home"><span class="bi">🏠</span>홈</button>
    <button class="bnav-btn" data-nav="stats"><span class="bi">📊</span>통계</button>
    <button class="fab" id="fabBtn">＋</button>
    <button class="bnav-btn" data-nav="profile"><span class="bi">👤</span>내정보</button>
    <button class="bnav-btn" id="sortHint"><span class="bi">↕</span>정렬</button>
  </div>
</nav>

<!-- Calendar -->
<div class="bd" id="calBd"></div>
<div class="sheet" id="calSheet">
  <div class="grabber"></div>
  <div class="cal-nav-row">
    <button class="cal-nav-btn" id="calPrev">‹</button>
    <strong class="cal-title" id="calTitle"></strong>
    <button class="cal-nav-btn" id="calNext">›</button>
  </div>
  <div class="cal-wds"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div>
  <div class="cal-grid" id="calGrid"></div>
  <div style="height:8px;"></div>
</div>

<!-- Add/Edit Sheet -->
<div class="bd" id="addBd"></div>
<div class="sheet" id="addSheet">
  <div class="grabber"></div>
  <div class="sh-hdr">
    <div><div class="sh-title" id="addTitle">추가</div><div class="sh-sub" id="addSub"></div></div>
    <button class="xbtn" id="closeAdd">✕</button>
  </div>
  <div id="addBody"></div>
</div>

<!-- Action Sheet -->
<div class="bd" id="actBd"></div>
<div class="sheet" id="actSheet">
  <div class="grabber"></div>
  <div class="sh-hdr">
    <div>
      <div class="act-eye" id="actEye">루틴</div>
      <div class="sh-title" id="actTitle">항목</div>
    </div>
    <button class="xbtn" id="closeAct">✕</button>
  </div>
  <div class="act-list" id="actList"></div>
</div>

<!-- Weight Popup -->
<div class="bd" id="wgtBd"></div>
<div class="popup" id="wgtPop">
  <div class="wgt-row">
    <div>
      <div class="wgt-title">⚖️ 몸무게 기록</div>
      <div class="wgt-sub" id="wgtSub"></div>
    </div>
    <button class="xbtn" id="closeWgt">✕</button>
  </div>
  <div class="wgt-inp-wrap">
    <input id="wgtInp" type="number" inputmode="decimal" step="0.1" placeholder="54.3"/>
    <span class="wgt-unit">kg</span>
  </div>
  <div class="wgt-btns">
    <button class="btn btn-ghost" id="cancelWgt">취소</button>
    <button class="btn btn-primary" id="saveWgt">저장</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(()=>{
'use strict';
const KEY='rtb_v5';
const S={
  view:'home',sub:'routine',date:'',cat:'__all__',
  calY:0,calM:0,boards:{},weights:{},
  actTarget:null,wgtTarget:null,sortMode:false,
  cats:[
    {l:'하루',e:''},
    {l:'건강 챙기기',e:'💪'},
    {l:'나 돌보기',e:'💚'},
    {l:'정돈된 일상',e:'✨'},
    {l:'출근',e:'🚇'},
    {l:'퇴근 후',e:'🌙'},
    {l:'고양이',e:'🐈'},
  ]
};

const SAMPLE=[{
  id:g(),category:'하루',theme:'yellow',label:'눈 뜨면',title:'🌞 모닝 루틴',emoji:'🌞',
  items:[
    {hk:g(),time:'일어나자마자',text:'공복에 물 한 잔',emoji:'🥛',checked:false},
    {hk:g(),time:'07:20',text:'몸무게 기록',emoji:'🧡',rtype:'weight',checked:false},
    {hk:g(),time:'07:25',text:'컨디션 체크',emoji:'✅',checked:false},
  ]
}];

function g(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);}
function p2(n){return String(n).padStart(2,'0');}
function fk(d){return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function fd(k){const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
function today(){return fk(new Date());}
function e(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1700);}

function save(){localStorage.setItem(KEY,JSON.stringify({date:S.date,boards:S.boards,weights:S.weights,view:S.view,sub:S.sub,cat:S.cat}));}
function load(){
  const raw=localStorage.getItem(KEY),t=today();
  if(!raw){
    S.date=t;S.boards[t]={groups:structuredClone(SAMPLE),todos:[]};
    const d=fd(t);S.calY=d.getFullYear();S.calM=d.getMonth()+1;
    save();return;
  }
  try{
    const p=JSON.parse(raw);
    S.date=p.date||t;S.boards=p.boards||{};S.weights=p.weights||{};
    S.view=p.view||'home';S.sub=p.sub||'routine';
    // 앱 실행 시에는 저장된 카테고리와 관계없이 전체 페이지를 먼저 보여줍니다.
    S.cat='__all__';
    Object.values(S.boards).forEach(b=>{
      b.groups=b.groups||[];b.todos=b.todos||[];
      b.groups.forEach(g=>{if(!g.id)g.id=g();g.items=(g.items||[]).map(it=>({...it,hk:it.hk||g()}));});
    });
  }catch{S.date=t;S.boards[t]={groups:structuredClone(SAMPLE),todos:[]};}
  const d=fd(S.date);S.calY=d.getFullYear();S.calM=d.getMonth()+1;
}

function board(dk){dk=dk||S.date;if(!S.boards[dk])S.boards[dk]={groups:[],todos:[]};return S.boards[dk];}
function curB(){return board(S.date);}

function dayStatus(dk){
  const b=S.boards[dk];if(!b)return'';
  const its=b.groups.flatMap(g=>g.items||[]);
  const tds=b.todos||[];
  const total=its.length+tds.length;if(!total)return'';
  const done=its.filter(i=>i.checked).length+tds.filter(t=>t.done).length;
  if(done===0)return'';
  if(done===total)return'done';          // 전부 완료 → 초록
  if(done/total>=2/3)return'partial';   // 2/3 이상 → 노랑
  return'low';                           // 1개 이상 → 빨강
}

function weekDays(){
  const sel=fd(S.date);
  const off=sel.getDay()===0?-6:1-sel.getDay();
  const mon=new Date(sel);mon.setDate(sel.getDate()+off);
  const WL=['일','월','화','수','목','금','토'];
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return{key:fk(d),lbl:WL[d.getDay()],num:d.getDate()};});
}

function calcStreak(){
  let d=fd(S.date),n=0;
  while(true){
    const k=fk(d);const b=S.boards[k];
    if(!b)break;
    const its=b.groups.flatMap(g=>g.items||[]);const tds=b.todos||[];
    const total=its.length+tds.length;const done=its.filter(i=>i.checked).length+tds.filter(t=>t.done).length;
    if(total>0&&done===total){n++;d.setDate(d.getDate()-1);}else break;
  }
  return n;
}

function streak(hk){
  let d=fd(S.date),n=0;
  while(true){
    const k=fk(d);const b=S.boards[k];
    const found=b&&b.groups.flatMap(x=>x.items).find(it=>it.hk===hk&&it.checked);
    if(found){n++;d.setDate(d.getDate()-1);}else break;
  }
  return Math.max(0,n-1);
}

function isW(it){return it.rtype==='weight'||String(it.text||'').includes('몸무게');}
function wKey(it){return it.hk||'w';}
function wVal(it,dk){return(S.weights[dk||S.date]||{})[wKey(it)]||'';}

/* ── RENDER ── */
function render(){renderHdr();renderTabs();renderBoard();}

function renderHdr(){
  const d=fd(S.date);
  document.getElementById('monthLbl').textContent=`${d.getFullYear()}년 ${d.getMonth()+1}월`;
  document.getElementById('streakNum').textContent=calcStreak();

  const wd=weekDays();
  document.getElementById('weekWrap').innerHTML=wd.map(d=>{
    const s=dayStatus(d.key),sel=d.key===S.date?'sel':'';
    return`<div class="day-col">
      <div class="wd-lbl">${d.lbl}</div>
      <button class="day-circle ${sel} ${s}" data-dk="${d.key}">${d.num}</button>
    </div>`;
  }).join('');

  const catRow=document.getElementById('catRow');
  if(S.view==='home'&&S.sub==='routine'){
    catRow.style.display='flex';
    const allChip=`<button class="cat-chip${S.cat==='__all__'?' act':''}" data-cat="__all__">🗂️ 전체</button>`;
    const chips=S.cats.map(c=>`<button class="cat-chip${S.cat===c.l?' act has-arrow':''}" data-cat="${e(c.l)}">${c.e?`<span>${c.e}</span>`:''}${e(c.l)}${S.cat===c.l?' <span class="cat-caret">∨</span>':''}</button>`).join('');
    catRow.innerHTML=allChip+chips+`<button class="view-icon-btn">▤</button>`;
  }else catRow.style.display='none';
}

function renderTabs(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('act',b.dataset.nav===S.view));
  const fab=document.getElementById('fabBtn');
  const tr=document.getElementById('tabRow');
  if(S.view==='home'){
    tr.style.display='grid';fab.style.display='grid';
    const n=curB().todos.length;
    tr.innerHTML=`
      <button class="tab-btn${S.sub==='routine'?' act':''}" data-sv="routine">루틴</button>
      <button class="tab-btn${S.sub==='todo'?' act':''}" data-sv="todo">투두 (${n})</button>`;
  }else{tr.style.display='none';fab.style.display='none';}
}

function renderBoard(){
  const el=document.getElementById('board');
  if(S.view==='stats'){el.innerHTML='';renderStats(el);return;}
  if(S.view==='profile'){el.innerHTML='';renderProfile(el);return;}
  if(S.sub==='todo'){renderTodos(el);return;}
  renderRoutines(el);
}

function thC(t){return{yellow:'th-yellow',purple:'th-purple',lime:'th-lime',green:'th-green'}[t]||'th-yellow';}

function renderRoutines(el){
  const b=curB();
  const gs=S.cat==='__all__'?b.groups:S.cat==='하루'?b.groups.filter(g=>!g.category||g.category==='하루'):b.groups.filter(g=>g.category===S.cat);
  if(!gs.length){el.innerHTML=`<div class="empty-box"><div class="ei">🗂️</div><p>루틴이 없어요.<br>아래 ＋ 버튼으로 추가해보세요.</p></div>`;return;}
  el.innerHTML=gs.map(renderGC).join('');
  initDrag();
}

function renderGC(g){
  const its=g.items||[];
  const done=its.filter(i=>i.checked).length;
  const leftIcon=S.sortMode?'↕':'▼';
  return`<div class="gc ${thC(g.theme)}" data-gid="${e(g.id)}" draggable="true">
    <div class="gc-hdr">
      <div class="gc-hdr-toggle" data-tog="${e(g.id)}" title="${S.sortMode?'드래그해서 그룹 순서 변경':'접기/펼치기'}">${leftIcon}</div>
      <div class="gc-hdr-mid" data-grp-act="${e(g.id)}">
        <div class="gc-hdr-label">${e(g.label||'')}</div>
        <div class="gc-hdr-title">${e(g.title||'')}</div>
      </div>
      <div class="gc-hdr-score" data-grp-act="${e(g.id)}">
        <div class="gc-score-emoji">${e(g.emoji||'✅')}</div>
        <div class="gc-score-txt">${done}/${its.length}</div>
      </div>
    </div>
    <div class="items-wrap" data-gid="${e(g.id)}">
      ${its.map((it,i)=>renderItem(g.id,it,i)).join('')}
      ${!its.length?`<div style="padding:13px 16px;font-size:13px;color:var(--muted);text-align:center;">항목을 추가해보세요</div>`:''}
    </div>
  </div>`;
}

function renderItem(gid,it,idx){
  const s=streak(it.hk);
  const wv=isW(it)?wVal(it):'';
  const isFirst=idx===0;
  const numTxt=isFirst?'🔔':`${idx+1}`;
  const chkContent=it.checked
    ?`<div class="chk-emoji">${e(it.emoji||'✅')}</div><div class="chk-val">${wv||''}</div>`
    :`<div class="chk-ring"></div>`;
  return`<div class="item-row${it.checked?' done':''}" data-gid="${e(gid)}" data-idx="${idx}" draggable="true">
    <div class="item-num${isFirst?' first':''}" title="드래그해서 순서 변경">${numTxt}</div>
    <div class="item-time" data-oa="${idx}" data-og="${e(gid)}">${e(it.time||'')}</div>
    <div class="item-body" data-oa="${idx}" data-og="${e(gid)}">
      <span class="item-text">${e(it.text)}</span>
      ${s>0?`<span class="streak-bdg">🔥${s}</span>`:''}
    </div>
    <div class="item-check" data-chk="${idx}" data-cg="${e(gid)}">${chkContent}</div>
  </div>`;
}

function renderTodos(el){
  const tds=curB().todos||[];
  if(!tds.length){el.innerHTML=`<div class="empty-box"><div class="ei">📝</div><p>투두가 없어요.<br>＋ 버튼으로 추가해보세요.</p></div>`;return;}
  el.innerHTML=`<div class="todo-list">${tds.map((t,i)=>`
    <div class="todo-item${t.done?' done':''}" data-td="${i}">
      <div class="td-chk">✓</div>
      <div style="flex:1;min-width:0;">
        <div class="todo-text">${e(t.text)}</div>
        ${t.time?`<div class="todo-time">${e(t.time)}</div>`:''}
      </div>
      <button class="todo-edit" data-etd="${i}">✏️</button>
    </div>`).join('')}</div>`;
}

/* ── STATS ── */
function renderStats(el){
  const d=fd(S.date),y=d.getFullYear(),m=d.getMonth()+1;
  const days=new Date(y,m,0).getDate();
  const keys=Array.from({length:days},(_,i)=>`${y}-${p2(m)}-${p2(i+1)}`);
  let rt=0,rd=0,tt=0,td2=0;
  keys.forEach(k=>{const b=S.boards[k];if(!b)return;b.groups.forEach(g=>(g.items||[]).forEach(it=>{rt++;if(it.checked)rd++;}));(b.todos||[]).forEach(t=>{tt++;if(t.done)td2++;});});
  const total=rt+tt,done=rd+td2,rate=total?Math.round(done/total*100):0;
  const hm=new Map();
  keys.forEach(k=>{const b=S.boards[k];if(!b)return;b.groups.forEach(g=>(g.items||[]).forEach(it=>{if(!hm.has(it.hk))hm.set(it.hk,{text:it.text,emoji:it.emoji||'✅',days:{}});hm.get(it.hk).days[k]={e:true,c:it.checked};}));});
  const hs=Array.from(hm.values());
  el.innerHTML=`<div class="stats-wrap">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <button style="width:30px;height:30px;border-radius:9px;background:var(--white);border:1px solid var(--line);font-size:15px;display:grid;place-items:center;" data-sm="-1">‹</button>
      <strong style="font-size:15px;font-weight:900;">${y}년 ${m}월 통계</strong>
      <button style="width:30px;height:30px;border-radius:9px;background:var(--white);border:1px solid var(--line);font-size:15px;display:grid;place-items:center;" data-sm="1">›</button>
    </div>
    <div class="sc">
      <h3>📊 달성률</h3>
      <div class="sc-big">${rate}%</div>
      <div class="sc-note">${done}/${total} 완료</div>
      <div class="prog"><div style="width:${rate}%"></div></div>
      <div class="sg">
        <div class="sm"><strong>${rd}/${rt}</strong><span>루틴</span></div>
        <div class="sm"><strong>${td2}/${tt}</strong><span>투두</span></div>
        <div class="sm"><strong>${rate}%</strong><span>달성률</span></div>
      </div>
    </div>
    ${hs.length?`<div class="hg">${hs.slice(0,8).map(h=>{
      const ad=keys.filter(k=>h.days[k]?.e).length,dd=keys.filter(k=>h.days[k]?.c).length;

/* ── DRAG ── */
let dType=null,dGid=null,dSrc=null;
function initDrag(){
  // 데스크탑 그룹 드래그
  document.querySelectorAll('.gc').forEach(card=>{
    card.addEventListener('dragstart',ev=>{
      if(!S.sortMode){ev.preventDefault();return;}
      if(ev.target.closest('button,.item-row')){ev.preventDefault();return;}
      if(!ev.target.closest('.gc-hdr-toggle')){ev.preventDefault();return;}
      dType='group';dGid=card.dataset.gid;dSrc=card;
      ev.dataTransfer.effectAllowed='move';
      setTimeout(()=>card.style.opacity='.5',0);
    });
    card.addEventListener('dragend',()=>{card.style.opacity='';card.style.outline='';});
    card.addEventListener('dragover',ev=>{if(!S.sortMode||dType!=='group')return;ev.preventDefault();card.style.outline='2px dashed var(--green)';});
    card.addEventListener('dragleave',()=>card.style.outline='');
    card.addEventListener('drop',ev=>{
      card.style.outline='';if(!S.sortMode||dType!=='group'||dGid===card.dataset.gid)return;
      ev.preventDefault();
      const b=curB(),fi=b.groups.findIndex(x=>x.id===dGid),ti=b.groups.findIndex(x=>x.id===card.dataset.gid);
      if(fi<0||ti<0)return;const[m]=b.groups.splice(fi,1);b.groups.splice(ti,0,m);save();render();
    });
  });
  // 데스크탑 아이템 드래그
  document.querySelectorAll('.item-row').forEach(row=>{
    row.addEventListener('dragstart',ev=>{
      if(!S.sortMode){ev.preventDefault();return;}
      if(!ev.target.closest('.item-num')){ev.preventDefault();return;}
      dType='item';dSrc=row;dGid=row.dataset.gid;
      ev.dataTransfer.effectAllowed='move';
      setTimeout(()=>row.style.opacity='.4',0);
    });
    row.addEventListener('dragend',()=>row.style.opacity='');
    row.addEventListener('dragover',ev=>{if(!S.sortMode||dType!=='item'||row.dataset.gid!==dGid)return;ev.preventDefault();});
    row.addEventListener('drop',ev=>{
      if(!S.sortMode||dType!=='item'||row===dSrc||row.dataset.gid!==dGid)return;
      ev.preventDefault();
      const b=curB(),grp=b.groups.find(x=>x.id===dGid);if(!grp)return;
      const fi=parseInt(dSrc.dataset.idx,10),ti=parseInt(row.dataset.idx,10);
      if(isNaN(fi)||isNaN(ti))return;
      const[m]=grp.items.splice(fi,1);grp.items.splice(ti,0,m);save();render();
    });
  });

  // 모바일 터치 아이템 드래그 (render 없이 DOM 직접 이동)
  document.querySelectorAll('.item-num').forEach(handle=>{
    let ghost=null,srcRow=null,startGid=null,list=null,startY=0;
    handle.addEventListener('touchstart',ev=>{
      if(!S.sortMode)return;
      srcRow=handle.closest('.item-row');
      if(!srcRow)return;
      startGid=srcRow.dataset.gid;
      list=srcRow.closest('.items-wrap');
      startY=ev.touches[0].clientY;
      const rect=srcRow.getBoundingClientRect();
      ghost=srcRow.cloneNode(true);
      ghost.style.cssText='position:fixed;left:'+rect.left+'px;top:'+rect.top+'px;width:'+rect.width+'px;opacity:.8;z-index:999;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.2);border-radius:6px;';
      document.body.appendChild(ghost);
      srcRow.style.opacity='.25';
      ev.preventDefault();
    },{passive:false});

    handle.addEventListener('touchmove',ev=>{
      if(!ghost||!S.sortMode)return;
      ev.preventDefault();
      const cy=ev.touches[0].clientY;
      const newTop=parseFloat(ghost.style.top)+(cy-startY);
      ghost.style.top=newTop+'px';
      startY=cy;
      // 손가락 위치에 있는 다른 row 찾기
      ghost.style.display='none';
      const el=document.elementFromPoint(ev.touches[0].clientX,cy);
      ghost.style.display='';
      const targetRow=el&&el.closest&&el.closest('.item-row');
      if(targetRow&&targetRow!==srcRow&&targetRow.dataset.gid===startGid){
        const fi=parseInt(srcRow.dataset.idx,10);
        const ti=parseInt(targetRow.dataset.idx,10);
        if(!isNaN(fi)&&!isNaN(ti)&&fi!==ti){
          // DOM 이동
          if(ti>fi) list.insertBefore(srcRow,targetRow.nextSibling);
          else list.insertBefore(srcRow,targetRow);
          // data-idx 갱신
          [...list.querySelectorAll('.item-row')].forEach((r,i)=>r.dataset.idx=i);
          // 데이터 이동
          const grp=curB().groups.find(x=>x.id===startGid);
          if(grp){const[m]=grp.items.splice(fi,1);grp.items.splice(ti,0,m);}
        }
      }
    },{passive:false});

    handle.addEventListener('touchend',()=>{
      if(ghost){ghost.remove();ghost=null;}
      if(srcRow){srcRow.style.opacity='';srcRow=null;}
      save();render();
      list=null;startGid=null;
    });
    handle.addEventListener('touchcancel',()=>{
      if(ghost){ghost.remove();ghost=null;}
      if(srcRow){srcRow.style.opacity='';srcRow=null;}
      list=null;startGid=null;
    });
  });

  // 모바일 터치 그룹 드래그
  document.querySelectorAll('.gc-hdr-toggle').forEach(handle=>{
    let ghost=null,srcCard=null,startGid=null,startY=0,boardEl=null;
    handle.addEventListener('touchstart',ev=>{
      if(!S.sortMode)return;
      srcCard=handle.closest('.gc');
      if(!srcCard)return;
      startGid=srcCard.dataset.gid;
      boardEl=document.getElementById('board');
      startY=ev.touches[0].clientY;
      const rect=srcCard.getBoundingClientRect();
      ghost=document.createElement('div');
      ghost.style.cssText='position:fixed;left:'+rect.left+'px;top:'+rect.top+'px;width:'+rect.width+'px;height:50px;opacity:.7;z-index:999;pointer-events:none;background:var(--green-bg);border:2px dashed var(--green);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--green-dark);';
      ghost.textContent='이동 중...';
      document.body.appendChild(ghost);
      srcCard.style.opacity='.3';
      ev.preventDefault();
    },{passive:false});

    handle.addEventListener('touchmove',ev=>{
      if(!ghost||!S.sortMode)return;
      ev.preventDefault();
      const cy=ev.touches[0].clientY;
      ghost.style.top=(parseFloat(ghost.style.top)+(cy-startY))+'px';
      startY=cy;
      ghost.style.display='none';
      const el=document.elementFromPoint(ev.touches[0].clientX,cy);
      ghost.style.display='';
      const targetCard=el&&el.closest&&el.closest('.gc');
      if(targetCard&&targetCard!==srcCard){
        const cards=[...boardEl.querySelectorAll('.gc')];
        const fi=cards.indexOf(srcCard);
        const ti=cards.indexOf(targetCard);
        if(fi>=0&&ti>=0&&fi!==ti){
          if(ti>fi) boardEl.insertBefore(srcCard,targetCard.nextSibling);
          else boardEl.insertBefore(srcCard,targetCard);
          const b=curB();
          const dfi=b.groups.findIndex(x=>x.id===startGid);
          const dti=b.groups.findIndex(x=>x.id===targetCard.dataset.gid);
          if(dfi>=0&&dti>=0){const[m]=b.groups.splice(dfi,1);b.groups.splice(dti,0,m);}
        }
      }
    },{passive:false});

    const endFn=()=>{
      if(ghost){ghost.remove();ghost=null;}
      if(srcCard){srcCard.style.opacity='';srcCard=null;}
      save();render();
      boardEl=null;startGid=null;
    };
    handle.addEventListener('touchend',endFn);
    handle.addEventListener('touchcancel',endFn);
  });
}

/* ── CALENDAR ── */
function renderCal(){
  const y=S.calY,m=S.calM;
  document.getElementById('calTitle').textContent=`${y}년 ${m}월`;
  const first=new Date(y,m-1,1),ld=first.getDay(),lead=ld===0?6:ld-1;
  const daysIn=new Date(y,m,0).getDate(),cells=[];
  for(let i=lead;i>0;i--){const pl=new Date(y,m-1,0).getDate();cells.push(`<button class="cal-cell blank">${pl-i+1}</button>`);}
  for(let d=1;d<=daysIn;d++){
    const k=`${y}-${p2(m)}-${p2(d)}`;
    const s=dayStatus(k),sel=k===S.date?'sel':'';
    cells.push(`<button class="cal-cell ${sel} ${s}" data-calk="${k}">${d}</button>`);
  }
  while(cells.length%7)cells.push(`<button class="cal-cell blank"></button>`);
  document.getElementById('calGrid').innerHTML=cells.join('');
}

function visibleGroups(){
  const b=curB();
  if(S.cat==='__all__')return b.groups;
  if(S.cat==='하루')return b.groups.filter(g=>!g.category||g.category==='하루');
  return b.groups.filter(g=>g.category===S.cat);
}

function moveGroup(gid,dir){
  const b=curB();
  const vis=visibleGroups().map(g=>g.id);
  const vi=vis.indexOf(gid);
  if(vi<0)return false;
  const targetId=vis[vi+dir];
  if(!targetId)return false;

  const from=b.groups.findIndex(g=>g.id===gid);
  if(from<0)return false;
  const [moved]=b.groups.splice(from,1);
  const targetNow=b.groups.findIndex(g=>g.id===targetId);
  if(targetNow<0){b.groups.splice(from,0,moved);return false;}

  b.groups.splice(dir>0?targetNow+1:targetNow,0,moved);
  save();render();
  return true;
}

function moveItem(gid,idx,dir){
  const grp=curB().groups.find(g=>g.id===gid);
  if(!grp||!grp.items)return false;
  const ni=idx+dir;
  if(idx<0||ni<0||ni>=grp.items.length)return false;
  const [moved]=grp.items.splice(idx,1);
  grp.items.splice(ni,0,moved);
  save();render();
  return true;
}

  document.getElementById('actTitle').textContent=it.text;
  document.getElementById('actList').innerHTML=`
    ${isW(it)?`<button class="act-row" id="a-wgt"><span class="act-ico">⚖️</span><span><span class="act-ttl">몸무게 등록</span><span class="act-desc">이 날짜 몸무게를 기록합니다.</span></span></button>`:''}
    <button class="act-row" id="a-edt"><span class="act-ico">✏️</span><span><span class="act-ttl">수정</span><span class="act-desc">루틴 내용과 시간을 수정합니다.</span></span></button>
    <button class="act-row" id="a-up"><span class="act-ico">⬆️</span><span><span class="act-ttl">위로 이동</span><span class="act-desc">이 그룹 안에서 한 칸 위로 올립니다.</span></span></button>
    <button class="act-row" id="a-down"><span class="act-ico">⬇️</span><span><span class="act-ttl">아래로 이동</span><span class="act-desc">이 그룹 안에서 한 칸 아래로 내립니다.</span></span></button>
    <button class="act-row" id="a-tmr"><span class="act-ico">🌤️</span><span><span class="act-ttl">내일도 추가</span><span class="act-desc">같은 루틴을 내일 보드에 복사합니다.</span></span></button>
    <button class="act-row" id="a-wk"><span class="act-ico">🔁</span><span><span class="act-ttl">이번 주 반복</span><span class="act-desc">이번 주 날짜들에 반복 추가합니다.</span></span></button>
    <button class="act-row" id="a-wkd"><span class="act-ico">🏢</span><span><span class="act-ttl">평일 반복</span><span class="act-desc">월~금에 반복 추가합니다.</span></span></button>
    <button class="act-row danger" id="a-del"><span class="act-ico">🗑️</span><span><span class="act-ttl">항목 삭제</span><span class="act-desc">이 항목을 삭제합니다.</span></span></button>`;
  if(isW(it))document.getElementById('a-wgt').onclick=()=>{cs('actBd','actSheet');setTimeout(()=>openWgt(gid,idx),80);};
  document.getElementById('a-edt').onclick=()=>{cs('actBd','actSheet');setTimeout(()=>{buildItemForm(gid,idx);os('addBd','addSheet');},80);};
  document.getElementById('a-up').onclick=()=>{
    if(!moveItem(gid,idx,-1)){toast('이미 맨 위 항목이에요');return;}
    cs('actBd','actSheet');toast('위로 이동했어요');
  };
  document.getElementById('a-down').onclick=()=>{
    if(!moveItem(gid,idx,1)){toast('이미 맨 아래 항목이에요');return;}
    cs('actBd','actSheet');toast('아래로 이동했어요');
  };
  document.getElementById('a-tmr').onclick=()=>rptDate(gid,idx,1);
  document.getElementById('a-wk').onclick=()=>rptRange(gid,idx,'wk');
  document.getElementById('a-wkd').onclick=()=>rptRange(gid,idx,'wkd');
  document.getElementById('a-del').onclick=()=>{
    if(!confirm('삭제할까요?'))return;
    const grp=curB().groups.find(x=>x.id===gid);
    if(grp){grp.items.splice(idx,1);if(!grp.items.length)curB().groups=curB().groups.filter(x=>x.id!==gid);}
    save();cs('actBd','actSheet');render();toast('삭제됐어요');
  };
  os('actBd','actSheet');
}

function openGrpAct(gid){
  const grp=curB().groups.find(x=>x.id===gid);if(!grp)return;
  document.getElementById('actEye').textContent=grp.label||'그룹';
  document.getElementById('actTitle').textContent=grp.title||'그룹';
  document.getElementById('actList').innerHTML=`
    <button class="act-row" id="ga-add"><span class="act-ico">＋</span><span><span class="act-ttl">항목 추가</span><span class="act-desc">이 그룹에 루틴 항목을 추가합니다.</span></span></button>
    <button class="act-row" id="ga-edt"><span class="act-ico">✏️</span><span><span class="act-ttl">그룹 수정</span><span class="act-desc">라벨·제목·테마를 수정합니다.</span></span></button>
    <button class="act-row" id="ga-up"><span class="act-ico">⬆️</span><span><span class="act-ttl">그룹 위로 이동</span><span class="act-desc">현재 카테고리 안에서 한 칸 위로 올립니다.</span></span></button>
    <button class="act-row" id="ga-down"><span class="act-ico">⬇️</span><span><span class="act-ttl">그룹 아래로 이동</span><span class="act-desc">현재 카테고리 안에서 한 칸 아래로 내립니다.</span></span></button>
    <button class="act-row danger" id="ga-del"><span class="act-ico">🗑️</span><span><span class="act-ttl">그룹 삭제</span><span class="act-desc">이 그룹과 항목 전체를 삭제합니다.</span></span></button>`;
  document.getElementById('ga-add').onclick=()=>{cs('actBd','actSheet');setTimeout(()=>{buildItemForm(gid,null);os('addBd','addSheet');},80);};
  document.getElementById('ga-edt').onclick=()=>{cs('actBd','actSheet');setTimeout(()=>{buildGrpForm(gid);os('addBd','addSheet');},80);};
  document.getElementById('ga-up').onclick=()=>{
    if(!moveGroup(gid,-1)){toast('이미 맨 위 그룹이에요');return;}
    cs('actBd','actSheet');toast('그룹을 위로 이동했어요');
  };
  document.getElementById('ga-down').onclick=()=>{
    if(!moveGroup(gid,1)){toast('이미 맨 아래 그룹이에요');return;}
    cs('actBd','actSheet');toast('그룹을 아래로 이동했어요');
  };
  document.getElementById('ga-del').onclick=()=>{
    if(!confirm('그룹 전체를 삭제할까요?'))return;
    curB().groups=curB().groups.filter(x=>x.id!==gid);
    save();cs('actBd','actSheet');render();toast('그룹 삭제됐어요');
  };
  os('actBd','actSheet');
}

function rptDate(gid,idx,off){
  const grp=curB().groups.find(x=>x.id===gid);const it=grp?.items[idx];if(!it)return;
  const d=fd(S.date);d.setDate(d.getDate()+off);
  const dk=fk(d),tb=board(dk);
  let tg=tb.groups.find(x=>x.label===grp.label&&x.title===grp.title);
  if(!tg){tg={...structuredClone(grp),id:g(),items:[]};tb.groups.push(tg);}
  if(!tg.items.some(x=>x.hk===it.hk))tg.items.push({...structuredClone(it),checked:false});
  save();cs('actBd','actSheet');toast('추가됐어요');
}

function rptRange(gid,idx,mode){
  weekDays().forEach(d=>{
    const dt=fd(d.key),jsD=dt.getDay();
    if(mode==='wkd'&&(jsD===0||jsD===6))return;
    if(d.key===S.date)return;
    const off=Math.floor((dt-fd(S.date))/86400000);
    rptDate(gid,idx,off);
  });
  save();cs('actBd','actSheet');toast(mode==='wkd'?'평일 반복 추가됐어요':'이번 주 반복 추가됐어요');
}

/* ── WEIGHT ── */
function openWgt(gid,idx){
  S.wgtTarget={gid,idx};
  const grp=curB().groups.find(x=>x.id===gid);const it=grp?.items[idx];
  document.getElementById('wgtSub').textContent=`${S.date}`;
  document.getElementById('wgtInp').value=it?wVal(it):'';
  document.getElementById('wgtBd').classList.add('show');
  document.getElementById('wgtPop').classList.add('show');
  setTimeout(()=>document.getElementById('wgtInp').focus(),80);
}
function closeWgt(){
  document.getElementById('wgtBd').classList.remove('show');
  document.getElementById('wgtPop').classList.remove('show');
  S.wgtTarget=null;
}
function saveWgt(){
  const t=S.wgtTarget;if(!t)return;
  const val=String(document.getElementById('wgtInp').value||'').trim();
  if(!val){toast('몸무게를 입력해주세요');return;}
  const grp=curB().groups.find(x=>x.id===t.gid);const it=grp?.items[t.idx];if(!it)return;
  if(!S.weights[S.date])S.weights[S.date]={};
  S.weights[S.date][wKey(it)]=`${val}kg`;
  it.checked=true;
  save();closeWgt();render();toast(`${val}kg 기록됐어요`);
}

/* ── EVENTS ── */
document.addEventListener('click',ev=>{
  const t=ev.target;

  const nav=t.closest('[data-nav]');
  if(nav){S.view=nav.dataset.nav;save();render();return;}

  const dk=t.closest('[data-dk]');
  if(dk){S.date=dk.dataset.dk;S.sub='routine';const d=fd(S.date);S.calY=d.getFullYear();S.calM=d.getMonth()+1;save();render();return;}

  const sv=t.closest('[data-sv]');
  if(sv){S.sub=sv.dataset.sv;save();render();return;}

  const cat=t.closest('[data-cat]');
  if(cat){S.cat=cat.dataset.cat;save();render();return;}

  // check routine
  const chk=t.closest('[data-chk]');
  if(chk){
    const grp=curB().groups.find(x=>x.id===chk.dataset.cg);
    if(grp){const idx=parseInt(chk.dataset.chk,10);const it=grp.items[idx];if(it){
      if(isW(it)&&!it.checked){openWgt(chk.dataset.cg,idx);return;}
      it.checked=!it.checked;save();render();
    }}return;
  }

  // open item action sheet
  const oa=t.closest('[data-oa]');
  if(oa){openItemAct(oa.dataset.og,parseInt(oa.dataset.oa,10));return;}

  // open group action sheet
  const ga=t.closest('[data-grp-act]');
  if(ga){openGrpAct(ga.dataset.grpAct);return;}

  // toggle collapse
  const tog=t.closest('[data-tog]');
  if(tog){
    if(S.sortMode){toast('정렬 모드에서는 그룹 핸들을 드래그해서 이동하세요');return;}
    const gid=tog.dataset.tog;
    const wrap=document.querySelector(`.items-wrap[data-gid="${CSS.escape(gid)}"]`);
    if(wrap){const h=wrap.style.display==='none';wrap.style.display=h?'':'none';tog.textContent=h?'▼':'▶';}
    return;
  }

  // check todo
  const td=t.closest('[data-td]');
  if(td&&!t.closest('[data-etd]')){const i=parseInt(td.dataset.td,10);const x=curB().todos[i];if(x){x.done=!x.done;save();render();}return;}

  // edit todo
  const etd=t.closest('[data-etd]');
  if(etd){buildTdForm(parseInt(etd.dataset.etd,10));os('addBd','addSheet');return;}

  // delete todo form
  const dtd=t.closest('[data-dtd]');
  if(dtd){if(!confirm('삭제할까요?'))return;curB().todos.splice(parseInt(dtd.dataset.dtd,10),1);save();cs('addBd','addSheet');render();toast('삭제됐어요');return;}

  // delete group form
  const dgf=t.closest('[data-dgf]');
  if(dgf){if(!confirm('삭제할까요?'))return;curB().groups=curB().groups.filter(x=>x.id!==dgf.dataset.dgf);save();cs('addBd','addSheet');render();toast('그룹 삭제됐어요');return;}

  // delete item form
  const dif=t.closest('[data-dif]');
  if(dif){if(!confirm('삭제할까요?'))return;const grp=curB().groups.find(x=>x.id===dif.dataset.dif);if(grp)grp.items.splice(parseInt(dif.dataset.dii,10),1);save();cs('addBd','addSheet');render();toast('삭제됐어요');return;}

  if(t.closest('[data-ca]')){cs('addBd','addSheet');return;}

  // calendar date
  const calk=t.closest('[data-calk]');
  if(calk){S.date=calk.dataset.calk;S.sub='routine';const d=fd(S.date);S.calY=d.getFullYear();S.calM=d.getMonth()+1;save();cs('calBd','calSheet');render();return;}

  // stats month
  const sm=t.closest('[data-sm]');
  if(sm){const d=fd(S.date);d.setMonth(d.getMonth()+parseInt(sm.dataset.sm,10));S.date=fk(d);const dd=fd(S.date);S.calY=dd.getFullYear();S.calM=dd.getMonth()+1;save();render();return;}
});

document.getElementById('openCal').addEventListener('click',()=>{if(S.view!=='home')return;const d=fd(S.date);S.calY=d.getFullYear();S.calM=d.getMonth()+1;renderCal();os('calBd','calSheet');});
document.getElementById('gotoToday').addEventListener('click',()=>{S.date=today();S.sub='routine';const d=fd(S.date);S.calY=d.getFullYear();S.calM=d.getMonth()+1;save();render();toast('오늘로 이동했어요');});
document.getElementById('calBd').addEventListener('click',()=>cs('calBd','calSheet'));
document.getElementById('calPrev').addEventListener('click',()=>{S.calM--;if(S.calM<1){S.calM=12;S.calY--;}renderCal();});
document.getElementById('calNext').addEventListener('click',()=>{S.calM++;if(S.calM>12){S.calM=1;S.calY++;}renderCal();});
document.getElementById('addBd').addEventListener('click',()=>cs('addBd','addSheet'));
document.getElementById('closeAdd').addEventListener('click',()=>cs('addBd','addSheet'));
document.getElementById('actBd').addEventListener('click',()=>cs('actBd','actSheet'));
document.getElementById('closeAct').addEventListener('click',()=>cs('actBd','actSheet'));
document.getElementById('wgtBd').addEventListener('click',closeWgt);
document.getElementById('closeWgt').addEventListener('click',closeWgt);
document.getElementById('cancelWgt').addEventListener('click',closeWgt);
document.getElementById('saveWgt').addEventListener('click',saveWgt);
document.getElementById('wgtInp').addEventListener('keydown',ev=>{if(ev.key==='Enter')saveWgt();});
document.getElementById('fabBtn').addEventListener('click',openAdd);
document.getElementById('sortHint').addEventListener('click',()=>{
  S.sortMode=!S.sortMode;
  document.body.classList.toggle('sort-mode',S.sortMode);
  // 배너 토글
  let banner=document.getElementById('sortBanner');
  if(S.sortMode){
    if(!banner){
      banner=document.createElement('div');
      banner.id='sortBanner';
      banner.className='sort-mode-banner';
      banner.textContent='↕ 정렬 모드 — 그룹은 왼쪽 ↕, 항목은 숫자를 잡고 드래그해서 순서 변경';
      document.getElementById('board').before(banner);
    }
  }else{
    if(banner)banner.remove();
  }
  // ↕ 버튼 활성화 표시
  const btn=document.getElementById('sortHint');
  btn.style.color=S.sortMode?'var(--green-dark)':'';
  btn.style.background=S.sortMode?'var(--green-bg)':'';
  toast(S.sortMode?'정렬 모드 ON — 그룹 ↕ / 항목 숫자를 드래그하세요':'정렬 모드 OFF');
});

load();render();
})();
</script>
</body>
</html>
